<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft JSON Builder</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2828;
            --warning: #f59e0b;
            --warning-hover: #d97706;
            --border: #334155;
            --radius: 12px;
        }

        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            padding: 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            line-height: 1.5;
        }

        h1 { 
            text-align: center; 
            font-size: 28px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            margin-bottom: 30px;
        }

        .step { 
            background-color: var(--bg-card); 
            padding: 20px; 
            border-radius: var(--radius); 
            margin-bottom: 20px; 
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .step-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .step-header h3 { margin: 0; color: var(--primary); font-size: 18px; }
        .step p { color: var(--text-muted); font-size: 14px; margin-top: 0; margin-bottom: 15px; }

        .project-bar {
            display: flex;
            gap: 10px;
            align-items: center;
            background: var(--bg-card);
            padding: 15px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid var(--primary);
            flex-wrap: wrap;
        }

        select, input[type="text"] {
            background-color: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 6px;
            flex: 1;
            font-size: 15px;
            outline: none;
            min-width: 200px;
        }
        
        select:focus, input[type="text"]:focus { border-color: var(--primary); }

        .file-upload-wrapper { position: relative; display: flex; align-items: center; gap: 15px; }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-btn { background-color: var(--border); padding: 10px 15px; border-radius: 6px; display: flex; align-items: center; gap: 8px; font-weight: 500; transition: 0.2s; pointer-events: none; }
        .file-upload-wrapper:hover .file-btn { background-color: #475569; }
        .file-name { color: var(--success); font-weight: bold; font-size: 14px; }

        textarea { width: 100%; height: 180px; background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); border-radius: 8px; padding: 15px; font-family: 'Courier New', Courier, monospace; resize: vertical; box-sizing: border-box; outline: none; }
        textarea:focus { border-color: var(--primary); }

        .button-group { display: flex; gap: 15px; margin-top: 15px; flex-wrap: wrap; }
        button { display: flex; align-items: center; justify-content: center; gap: 8px; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; flex: 1; transition: all 0.2s; min-width: 200px; }
        
        .btn-primary { background-color: var(--primary); }
        .btn-primary:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-warning { background-color: var(--warning); color: #fff; }
        .btn-warning:hover { background-color: var(--warning-hover); transform: translateY(-2px); }
        .btn-danger { background-color: var(--danger); flex: 0.2; min-width: 60px; }
        .btn-danger:hover { background-color: var(--danger-hover); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: var(--success-hover); }
        
        .btn-icon-only { flex: none; padding: 10px 15px; background-color: var(--success); min-width: auto; }
        .btn-icon-only:hover { background-color: var(--success-hover); transform: translateY(-2px); }

        .log { margin-top: 20px; padding: 20px; background: #020617; border-radius: var(--radius); border: 1px solid var(--border); display: none; }
        .log h3 { margin-top: 0; color: white; display: flex; align-items: center; gap: 8px; }
        .log ul { padding-left: 0; list-style: none; margin: 0; }
        .log li { padding: 12px; margin-bottom: 10px; border-radius: 6px; font-size: 14px; }
        
        .log-success { background-color: rgba(16, 185, 129, 0.1); color: var(--success); border-left: 4px solid var(--success); }
        .log-warning { background-color: rgba(245, 158, 11, 0.1); color: var(--warning); border-left: 4px solid var(--warning); }
        .log-error { background-color: rgba(239, 68, 68, 0.1); color: var(--danger); border-left: 4px solid var(--danger); }
        .log-info { background-color: rgba(99, 102, 241, 0.1); color: #818cf8; border-left: 4px solid var(--primary); }
        .log-removed { background-color: rgba(220, 38, 38, 0.15); color: #fca5a5; border-left: 4px solid var(--danger); }
        
        .small-text { 
            font-size: 13px; 
            opacity: 0.9; 
            margin-top: 8px; 
            display: block; 
            font-family: 'Courier New', Courier, monospace; 
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow-y: auto;
            background: rgba(0,0,0,0.4);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .badge { background-color: var(--warning); color: white; padding: 2px 8px; border-radius: 12px; font-size: 11px; margin-left: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        svg { width: 20px; height: 20px; fill: currentColor; }
    </style>
</head>
<body>

    <h1>
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 7.5l-10-5v10l10 5 10-5v-10l-10 5z"/></svg>
        Збирач Перекладів PRO
    </h1>

    <div class="project-bar">
        <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 14H4V8h16v12z"/></svg>
        <select id="projectSelect" onchange="loadProjectInfo()">
            <option value="_fast_">⚡ Швидкий режим (без збереження)</option>
        </select>
        
        <button id="downloadProjectBtn" class="btn-icon-only" style="display: none;" onclick="downloadSavedProject()" title="Завантажити готовий переклад з пам'яті">
            <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </button>

        <input type="text" id="newProjectName" placeholder="Назва нового проекту...">
        <button class="btn-primary" style="flex: 0.5;" onclick="createProject()">Створити</button>
    </div>

    <div class="step">
        <div class="step-header">
            <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
            <h3>Крок 1: Англійський оригінал (en_us.json)</h3>
        </div>
        <div class="file-upload-wrapper">
            <input type="file" id="originalFile" accept=".json" onchange="updateFileName('originalFile', 'originalName')">
            <div class="file-btn">Вибрати файл</div>
            <span id="originalName" class="file-name">Файл не вибрано</span>
        </div>
    </div>

    <div class="step">
        <div class="step-header">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
            <h3>Крок 2: Старий переклад <span class="badge" id="projectStatusBadge">Одноразовий</span></h3>
        </div>
        <div class="file-upload-wrapper">
            <input type="file" id="oldTranslationFile" accept=".json" onchange="updateFileName('oldTranslationFile', 'oldName')">
            <div class="file-btn">Завантажити вручну</div>
            <span id="oldName" class="file-name">Немає файлу</span>
        </div>
    </div>

    <div class="step">
        <div class="step-header">
            <svg viewBox="0 0 24 24"><path d="M21 11.5v-1c0-3.8-3.1-7-7-7h-1V2c0-.6-.4-1-1-1s-1 .4-1 1v1.5h-1c-3.8 0-7 3.2-7 7v1H2v2h2v1c0 3.8 3.1 7 7 7h1v1.5c0 .6.4 1 1 1s1-.4 1-1V22h1c3.8 0 7-3.2 7-7v-1h2v-2h-2zm-10 7.5c-2.8 0-5-2.2-5-5v-1h10v1c0 2.8-2.2 5-5 5zm5-8H6v-1c0-2.8 2.2-5 5-5h2c2.8 0 5 2.2 5 5v1z"/></svg>
            <h3>Крок 3: Нові рядки від бота</h3>
        </div>
        <p>Сюди вставляй готові переклади, які зробив ШІ.</p>
        <textarea id="translatedText" placeholder='"block.hexcasting.slate": "Скрижаль", ...'></textarea>
    </div>

    <div class="button-group">
        <button class="btn-warning" onclick="analyzeJSONs()">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            1. Аналізувати файли
        </button>
        <button class="btn-primary" onclick="processTranslation()">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
            2. Зібрати JSON
        </button>
        <button class="btn-danger" onclick="resetForm()" title="Очистити все">
            <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>

    <div id="logArea" class="log">
        <h3>
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
            Звіт про роботу
        </h3>
        <ul id="logMessages"></ul>
        
        <div class="button-group" id="downloadCopyGroup" style="display:none; margin-top: 15px;">
            <button class="btn-success" onclick="downloadJSON()">Завантажити uk_ua.json</button>
            <button id="copyBtn" class="btn-success" style="background-color: var(--primary);" onclick="copyToClipboard()">Копіювати код</button>
        </div>
    </div>

    <script>
        let projects = {};
        let currentProjectName = "_fast_";
        let finalJsonString = "";

        window.onload = function() {
            loadProjectsFromStorage();
            updateProjectSelect();
            loadProjectInfo();
        };

        function loadProjectsFromStorage() {
            const saved = localStorage.getItem('minecraftTranslationsDB');
            if (saved) {
                try { projects = JSON.parse(saved); } 
                catch (e) { projects = {}; }
            }
        }

        function saveProjectsToStorage() {
            localStorage.setItem('minecraftTranslationsDB', JSON.stringify(projects));
        }

        function updateProjectSelect() {
            const select = document.getElementById('projectSelect');
            const currentValue = select.value || "_fast_";
            
            select.innerHTML = '<option value="_fast_">⚡ Швидкий режим (без збереження)</option>';
            
            for (let name in projects) {
                let opt = document.createElement('option');
                opt.value = name;
                opt.textContent = `📁 ${name} (${Object.keys(projects[name].translation).length} ключів)`;
                select.appendChild(opt);
            }
            select.value = (currentValue === "_fast_" || projects[currentValue]) ? currentValue : "_fast_";
        }

        function createProject() {
            const nameInput = document.getElementById('newProjectName');
            const name = nameInput.value.trim();
            if (!name) return alert("Введіть назву проекту!");
            if (name === "_fast_") return alert("Неприпустима назва!");
            if (projects[name]) return alert("Проект з такою назвою вже існує!");

            projects[name] = { translation: {} };
            saveProjectsToStorage();
            updateProjectSelect();
            
            document.getElementById('projectSelect').value = name;
            nameInput.value = "";
            loadProjectInfo();
        }

        function loadProjectInfo() {
            currentProjectName = document.getElementById('projectSelect').value;
            const badge = document.getElementById('projectStatusBadge');
            const downloadProjBtn = document.getElementById('downloadProjectBtn');
            
            if (currentProjectName === "_fast_") {
                badge.textContent = 'Одноразовий';
                badge.style.backgroundColor = 'var(--warning)';
                downloadProjBtn.style.display = 'none';
            } else if (currentProjectName && projects[currentProjectName]) {
                const keysCount = Object.keys(projects[currentProjectName].translation).length;
                badge.textContent = `В пам'яті: ${keysCount} рядків`;
                badge.style.backgroundColor = 'var(--success)';
                downloadProjBtn.style.display = keysCount > 0 ? 'block' : 'none';
            }
        }

        function downloadSavedProject() {
            if (currentProjectName === "_fast_" || !projects[currentProjectName]) return;
            const data = projects[currentProjectName].translation;
            if (Object.keys(data).length === 0) return alert("Цей проект поки що порожній!");
            
            const jsonString = JSON.stringify(data, null, 2);
            triggerDownload(jsonString, `${currentProjectName}_uk_ua.json`);
        }

        function updateFileName(inputId, spanId) {
            const input = document.getElementById(inputId);
            const span = document.getElementById(spanId);
            if (input.files.length > 0) {
                span.textContent = "✅ " + input.files[0].name;
                span.style.color = "var(--success)";
            } else {
                span.textContent = spanId === 'oldName' ? "Немає файлу" : "Файл не вибрано";
                span.style.color = "var(--text-muted)";
            }
        }

        function log(message, type = "log-success", subtext = "") {
            const logMessages = document.getElementById('logMessages');
            const li = document.createElement('li');
            li.className = type;
            li.textContent = message;
            
            if (subtext) {
                const span = document.createElement('span');
                span.className = "small-text";
                span.textContent = subtext;
                li.appendChild(span);
            }
            logMessages.appendChild(li);
        }

        function clearLog() {
            document.getElementById('logArea').style.display = 'block';
            document.getElementById('logMessages').innerHTML = '';
            document.getElementById('downloadCopyGroup').style.display = 'none';
        }

        function resetForm() {
            document.getElementById('originalFile').value = '';
            document.getElementById('oldTranslationFile').value = '';
            document.getElementById('translatedText').value = '';
            updateFileName('originalFile', 'originalName');
            updateFileName('oldTranslationFile', 'oldName');
            document.getElementById('logArea').style.display = 'none';
            finalJsonString = "";
        }

        function readFileAsJSON(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => {
                    try { resolve(JSON.parse(e.target.result)); } 
                    catch (err) { reject(new Error("Файл не є валідним JSON")); }
                };
                reader.onerror = () => reject(new Error("Помилка читання файлу"));
                reader.readAsText(file);
            });
        }

        async function getFilesData() {
            const originalFileInput = document.getElementById('originalFile');
            const oldTranslationFileInput = document.getElementById('oldTranslationFile');

            if (originalFileInput.files.length === 0) {
                throw new Error("Не завантажено оригінальний файл (en_us.json)!");
            }

            const originalObj = await readFileAsJSON(originalFileInput.files[0]);
            let oldTranslationObj = {};
            
            if (currentProjectName !== "_fast_" && projects[currentProjectName]) {
                oldTranslationObj = projects[currentProjectName].translation || {};
            }
            if (oldTranslationFileInput.files.length > 0) {
                oldTranslationObj = await readFileAsJSON(oldTranslationFileInput.files[0]);
            }

            return { originalObj, oldTranslationObj };
        }

        // --- НОВА ФУНКЦІЯ АНАЛІЗУ ---
        async function analyzeJSONs() {
            clearLog();
            try {
                const { originalObj, oldTranslationObj } = await getFilesData();

                let missingKeys = [];
                let missingJsonForBot = {};
                let outdatedKeys = [];

                // Аналіз неактуальних ключів
                for (let key in oldTranslationObj) {
                    if (!originalObj.hasOwnProperty(key)) {
                        outdatedKeys.push(key);
                    }
                }

                // Аналіз нових ключів
                for (let key in originalObj) {
                    if (!oldTranslationObj.hasOwnProperty(key)) {
                        missingKeys.push(key);
                        missingJsonForBot[key] = originalObj[key];
                    }
                }

                if (outdatedKeys.length > 0) {
                    log(`❌ Знайдено неактуальних ключів: ${outdatedKeys.length}. Вони будуть проігноровані при збірці.`, "log-removed", outdatedKeys.join('\n'));
                } else {
                    log(`✅ Старі ключі повністю актуальні.`, "log-success");
                }

                if (missingKeys.length > 0) {
                    const jsonStringForBot = JSON.stringify(missingJsonForBot, null, 2);
                    log(`🆕 Треба перекласти (нових ключів: ${missingKeys.length}). Скопіюй цей текст і відправ боту:`, "log-warning", jsonStringForBot);
                } else {
                    log(`🎉 Немає нових рядків для перекладу. Все готово!`, "log-success");
                }

            } catch (error) {
                log(`Помилка: ${error.message}`, "log-error");
            }
        }

        // --- ФУНКЦІЯ ЗБІРКИ ---
        async function processTranslation() {
            clearLog();
            finalJsonString = "";
            const translatedText = document.getElementById('translatedText').value;

            try {
                const { originalObj, oldTranslationObj } = await getFilesData();

                // Парсинг тексту від бота
                const regex = /"([^"]+)"\s*:\s*"([^"\\]*(?:\\.[^"\\]*)*)"/g;
                const newBotObj = {};
                let match;
                let parsedBotCount = 0;

                while ((match = regex.exec(translatedText)) !== null) {
                    let key = match[1];
                    let rawValue = match[2];
                    try { newBotObj[key] = JSON.parse('"' + rawValue + '"'); } 
                    catch (e) { newBotObj[key] = rawValue; }
                    parsedBotCount++;
                }

                if (parsedBotCount > 0) {
                    log(`🤖 Зчитано ${parsedBotCount} перекладів з текстового поля.`, "log-info");
                } else if (translatedText.trim() !== "") {
                    log(`⚠️ Текст в полі є, але ключі не знайдено. Перевір формат JSON.`, "log-warning");
                }

                // Збірка фінального об'єкту
                const finalObj = {};
                let stillMissingCount = 0;

                for (let key in originalObj) {
                    if (newBotObj.hasOwnProperty(key)) {
                        finalObj[key] = newBotObj[key];
                    } else if (oldTranslationObj.hasOwnProperty(key)) {
                        finalObj[key] = oldTranslationObj[key];
                    } else {
                        finalObj[key] = originalObj[key]; // Залишаємо англійський оригінал
                        stillMissingCount++;
                    }
                }

                if (stillMissingCount > 0) {
                    log(`⚠️ Зібрано, але залишилось не перекладено ${stillMissingCount} ключів (вставлено англійський текст).`, "log-warning");
                } else {
                    log(`✅ Успішно зібрано! Всі ключі перекладено.`, "log-success");
                }

                // ЗБЕРЕЖЕННЯ
                if (currentProjectName !== "_fast_") {
                    projects[currentProjectName].translation = finalObj;
                    saveProjectsToStorage();
                    updateProjectSelect();
                    document.getElementById('projectSelect').value = currentProjectName;
                    loadProjectInfo();
                    log(`💾 Проект "${currentProjectName}" збережено в пам'ять браузера.`, "log-success");
                }
                
                finalJsonString = JSON.stringify(finalObj, null, 2);
                document.getElementById('downloadCopyGroup').style.display = 'flex';

            } catch (error) {
                log(`Помилка: ${error.message}`, "log-error");
            }
        }

        function triggerDownload(content, filename) {
            const blob = new Blob([content], { type: "application/json;charset=utf-8" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadJSON() {
            if (finalJsonString) triggerDownload(finalJsonString, "uk_ua.json");
        }

        function copyToClipboard() {
            if (!finalJsonString) return;
            navigator.clipboard.writeText(finalJsonString).then(() => {
                const copyBtn = document.getElementById('copyBtn');
                const originalHtml = copyBtn.innerHTML;
                copyBtn.innerHTML = 'Скопійовано!';
                setTimeout(() => { copyBtn.innerHTML = originalHtml; }, 2000);
            }).catch(err => alert("Помилка копіювання: " + err));
        }
    </script>
</body>
</html>
